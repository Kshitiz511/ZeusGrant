[project]
name = "zeus-contract-compliance"
version = "0.0.0"
description = "Contract Compliance module service (contracts, obligations, AI extraction)"
requires-python = ">=3.12"
dependencies = [
    "zeus-config",
    "zeus-adapters",
    "zeus-service-kit",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn[standard]>=0.30",
    # Document ingestion: multipart parsing + pure-python text extraction.
    "python-multipart>=0.0.9",
    "pypdf>=5.1",
    "python-docx>=1.1",
]

[project.scripts]
zeus-contract-compliance = "zeus_contract_compliance.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeus_contract_compliance"]
