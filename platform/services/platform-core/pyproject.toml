[project]
name = "zeus-platform-core"
version = "0.0.0"
description = "Zeus Platform core service (identity, tenancy, entitlements, billing, admin)"
requires-python = ">=3.12"
dependencies = [
    "zeus-config",
    "zeus-adapters",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
zeus-core = "zeus_platform_core.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeus_platform_core"]
