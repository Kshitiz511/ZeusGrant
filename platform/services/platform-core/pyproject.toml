[project]
name = "zeus-platform-core"
version = "0.0.0"
description = "Zeus Platform core service (identity, tenancy, entitlements, billing, admin)"
requires-python = ">=3.12"
dependencies = [
    "zeus-config",
    "zeus-adapters",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Kept optional so the API image does not carry the model and MCP stacks. The
# web service never calls either: enrichment runs in the worker, and the MCP
# server is its own process. Installing them everywhere would enlarge every
# cold start to no purpose.
ai = [
    "pydantic-ai-slim[openai,anthropic]>=0.0.30",
    "mcp>=1.2.0",
]

[project.scripts]
zeus-core = "zeus_platform_core.__main__:main"
zeus-worker = "zeus_platform_core.worker_main:main"
zeus-grants-mcp = "zeus_platform_core.mcp_servers.grants_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeus_platform_core"]
