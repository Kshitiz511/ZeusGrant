[project]
name = "zeus-config"
version = "0.0.0"
description = "Typed configuration and secure secrets for the Zeus Platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "cryptography>=43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeus_config"]
