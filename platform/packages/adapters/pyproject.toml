[project]
name = "zeus-adapters"
version = "0.0.0"
description = "Vendor-neutral adapter interfaces and implementations for the Zeus Platform"
requires-python = ">=3.12"
dependencies = [
    "zeus-config",
    "httpx>=0.27",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
# Concrete providers are optional extras so a service only installs what it uses.
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
gemini = ["google-genai>=0.3"]
redis = ["redis>=5.0"]
postgres = ["asyncpg>=0.29"]
stripe = ["stripe>=10.0"]
supabase = ["supabase>=2.7"]
all = [
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=0.3",
    "redis>=5.0",
    "asyncpg>=0.29",
    "stripe>=10.0",
    "supabase>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeus_adapters"]
