[project]
name = "zeus-service-kit"
version = "0.0.0"
description = "Shared FastAPI security kit for Zeus module services (auth + entitlement guard)"
requires-python = ">=3.12"
dependencies = [
    "zeus-config",
    "zeus-adapters",
    "fastapi>=0.115",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeus_service_kit"]
