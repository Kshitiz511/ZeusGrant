# ---------------------------------------------------------------------------
# Local development stack. Gives production parity for the stateful pieces
# (Postgres, Redis) that Vercel cannot host, plus the FastAPI services.
#
#   docker compose up --build
#
# The core service applies migrations on start via the `migrate` one-shot.
# Secrets here are LOCAL ONLY throwaways — never reuse in any real environment.
# ---------------------------------------------------------------------------
name: zeus-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zeus
      POSTGRES_PASSWORD: zeus
      POSTGRES_DB: zeus
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply SQL migrations in order, then exit.
  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: zeus
    volumes:
      - ./services/platform-core/migrations:/migrations/00-platform-core:ro
      - ./services/contract-compliance/migrations:/migrations/10-contract-compliance:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e   # any failure aborts, so services never start on a half-migrated DB

        PSQL="psql -h postgres -U zeus -d zeus -v ON_ERROR_STOP=1 -q"

        # Ledger of applied migrations: each file runs exactly once, ever.
        $$PSQL -c "CREATE SCHEMA IF NOT EXISTS platform;
                   CREATE TABLE IF NOT EXISTS platform.schema_migrations (
                       filename    text PRIMARY KEY,
                       applied_at  timestamptz NOT NULL DEFAULT now()
                   );"

        # Platform schema must exist before module schemas. Directory prefixes
        # (00-, 10-) enforce cross-service ordering; files within sort by name.
        for f in $$(ls /migrations/*/*.sql | sort); do
          name=$$(echo "$$f" | sed 's#^/migrations/##')
          applied=$$($$PSQL -tAc "SELECT 1 FROM platform.schema_migrations WHERE filename = '$$name'")
          if [ "$$applied" = "1" ]; then
            echo "skipping  $$name (already applied)"
            continue
          fi
          echo "applying  $$name"
          # Single transaction per migration: it either lands completely or not
          # at all, and the ledger row commits with it.
          $$PSQL --single-transaction \
            -f "$$f" \
            -c "INSERT INTO platform.schema_migrations (filename) VALUES ('$$name')"
        done
        echo "migrations up to date"

  platform-core:
    build:
      context: .
      args:
        MODULE: zeus_platform_core.app:create_app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ZEUS_ENV: development
      ZEUS_DEV_TOKENS: "true"
      ZEUS_SECRETS_ENCRYPTION_KEY: "${ZEUS_SECRETS_ENCRYPTION_KEY:-}"
      ZEUS_DATABASE_PROVIDER: postgres
      # zeus_app is NOSUPERUSER/non-owner so RLS policies apply (see 0002_rls.sql).
      ZEUS_DATABASE_URL: postgresql://zeus_app:zeus_app@postgres:5432/zeus
      ZEUS_CACHE_PROVIDER: redis
      ZEUS_REDIS_URL: redis://redis:6379/0
      ZEUS_QUEUE_PROVIDER: memory
      ZEUS_AUTH_PROVIDER: supabase
      ZEUS_SUPABASE_JWT_SECRET: "local-dev-jwt-secret-please-change"
      # LLM: point at the host's Ollama (macOS/Windows Docker Desktop DNS name).
      ZEUS_LLM_PROVIDER: "${ZEUS_LLM_PROVIDER:-ollama}"
      ZEUS_LLM_MODEL: "${ZEUS_LLM_MODEL:-gemma3:4b}"
      ZEUS_OLLAMA_BASE_URL: "${ZEUS_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}"
      ZEUS_OPENAI_API_KEY: "${ZEUS_OPENAI_API_KEY:-}"
    ports:
      - "8000:8000"

  contract-compliance:
    build:
      context: .
      args:
        MODULE: zeus_contract_compliance.app:create_app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ZEUS_ENV: development
      ZEUS_DATABASE_PROVIDER: postgres
      ZEUS_DATABASE_URL: postgresql://zeus_app:zeus_app@postgres:5432/zeus
      ZEUS_CACHE_PROVIDER: redis
      ZEUS_REDIS_URL: redis://redis:6379/0
      ZEUS_QUEUE_PROVIDER: memory
      ZEUS_AUTH_PROVIDER: supabase
      ZEUS_SUPABASE_JWT_SECRET: "local-dev-jwt-secret-please-change"
      ZEUS_LLM_PROVIDER: "${ZEUS_LLM_PROVIDER:-ollama}"
      ZEUS_LLM_MODEL: "${ZEUS_LLM_MODEL:-gemma3:4b}"
      ZEUS_OLLAMA_BASE_URL: "${ZEUS_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}"
      ZEUS_OPENAI_API_KEY: "${ZEUS_OPENAI_API_KEY:-}"
      # Uploaded documents. `local` keeps dev self-contained; production sets
      # ZEUS_STORAGE_PROVIDER=supabase and needs no code change.
      ZEUS_STORAGE_PROVIDER: "${ZEUS_STORAGE_PROVIDER:-local}"
      ZEUS_STORAGE_BUCKET: "${ZEUS_STORAGE_BUCKET:-evidence}"
      ZEUS_STORAGE_LOCAL_PATH: /var/lib/zeus/storage
      ZEUS_STORAGE_MAX_UPLOAD_MB: "${ZEUS_STORAGE_MAX_UPLOAD_MB:-25}"
    volumes:
      # Named volume so uploads survive a container rebuild.
      - objectdata:/var/lib/zeus/storage
    ports:
      - "8001:8000"

  # Web console: static build behind nginx, proxying /api/* to the services.
  console:
    build:
      context: ./apps/console
    depends_on:
      - platform-core
      - contract-compliance
    ports:
      - "5174:80"

volumes:
  pgdata:
  objectdata:
