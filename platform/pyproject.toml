[project]
name = "zeus-platform"
version = "0.0.0"
description = "Zeus Platform monorepo root (uv workspace)"
requires-python = ">=3.12"
# The root is a virtual project; real code lives in the workspace members.
#
# The adapter extras are pinned here because this is what a deployment installs.
# The services depend on bare "zeus-adapters" so a self-host can pick its own
# providers, but that left the concrete drivers to be supplied by whatever
# invoked them -- docker-compose did, Vercel did not, and the function crashed
# on a missing asyncpg. Declaring them at the root makes the production
# provider set explicit and installed by default.
dependencies = [
    "zeus-config",
    "zeus-adapters[postgres,redis,stripe,supabase,openai]",
    "zeus-service-kit",
    "zeus-platform-core",
    "zeus-contract-compliance",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
zeus-config = { workspace = true }
zeus-adapters = { workspace = true }
zeus-service-kit = { workspace = true }
zeus-platform-core = { workspace = true }
zeus-contract-compliance = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
