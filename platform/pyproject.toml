[project]
name = "zeus-platform"
version = "0.0.0"
description = "Zeus Platform monorepo root (uv workspace)"
requires-python = ">=3.12"
# The root is a virtual project; real code lives in the workspace members.
#
# The adapter extras are pinned here because this is what a deployment installs.
# The services depend on bare "zeus-adapters" so a self-host can pick its own
# providers, but that left the concrete drivers to be supplied by whatever
# invoked them -- docker-compose did, Vercel did not, and the function crashed
# on a missing asyncpg. Declaring them at the root makes the production
# provider set explicit and installed by default.
dependencies = [
    "zeus-config",
    "zeus-adapters[postgres,redis,stripe,supabase,openai]",
    "zeus-service-kit",
    "zeus-platform-core",
    "zeus-contract-compliance",
    # Enrichment runs on the same Vercel function as everything else, because
    # serverless has no long-lived worker process -- the queue wakes the
    # function and it drains its own ledger. So "the worker installs this, the
    # API does not" is not a distinction production can make. Left out, the
    # import inside the enrichment handler fails and the feature is dead in
    # production while passing every test locally.
    "pydantic-ai-slim[openai]>=0.0.30",
]

[project.optional-dependencies]
# MCP stays optional: the grants MCP server genuinely is its own process and is
# never reached from the function, so shipping it would enlarge every cold
# start for nothing.
ai = [
    "mcp>=1.2.0",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
zeus-config = { workspace = true }
zeus-adapters = { workspace = true }
zeus-service-kit = { workspace = true }
zeus-platform-core = { workspace = true }
zeus-contract-compliance = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
