name: Deploy

# Production deploys happen here and only here, so what is running is always a
# commit on main that passed the gate. Deploying from a laptop leaves no record
# of what was shipped and skips the tests.
on:
  push:
    branches: [main]
  workflow_dispatch: # manual redeploy without an empty commit

concurrency:
  # Never let two deploys race; a slow one must not overwrite a newer one.
  group: production
  cancel-in-progress: false

jobs:
  gate:
    # Reuses ci.yml rather than duplicating it, so the gate cannot drift from
    # what PRs are checked against.
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `vercel build` resolves the Python function's dependencies with uv, the
      # same way the hosted builder does. Without it the build fails before it
      # ever reaches the deploy step.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Schema first, and before anything is built or deployed.
      #
      # ci.yml proves migrations apply to an empty database; it says nothing
      # about production, which was three versions behind because no step here
      # ever touched it. New code that expects a column production does not
      # have fails at runtime, after the deploy reports success.
      #
      # Ordering is migrate-then-deploy because every migration is written to
      # be applied ahead of the code that needs it. The reverse order
      # guarantees a broken window; this order costs a short one only when a
      # migration removes something the running code still uses.
      #
      # The ledger makes this safe to repeat: already-applied files are
      # skipped, so a re-run or a manual redeploy is a no-op.
      - name: Apply migrations to production
        env:
          ZEUS_MIGRATE_URL: ${{ secrets.ZEUS_MIGRATE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${ZEUS_MIGRATE_URL:-}" ]; then
            echo "ZEUS_MIGRATE_URL is not set on the production environment."
            echo "Add it as a secret (session pooler, port 5432)."
            exit 1
          fi
          # Shown first so the log records what was about to change, even if
          # the apply then fails part way.
          uv run --with asyncpg python scripts/migrate.py --dry-run
          # --yes is required because the runner cannot answer the confirmation
          # prompt that guards remote databases. The review that authorises this
          # apply is the pull request, not a keystroke.
          uv run --with asyncpg python scripts/migrate.py --yes

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Smoke test
        # A green build is not a working deployment. This is the minimum proof
        # that the function actually boots and its dependencies resolve.
        #
        # Probes the production alias, not the unique deployment URL: the
        # latter sits behind Vercel Deployment Protection and answers 302 to an
        # SSO redirect regardless of application health, which fails every time
        # and triggers a rollback of a perfectly good deploy. The alias is also
        # what users actually reach, so it is the honest thing to verify.
        #
        # Asserts on the commit too. A 200 alone can come from the *previous*
        # deployment if the alias has not moved yet, which would report success
        # while the new code is nowhere in production.
        run: |
          set -euo pipefail
          url="https://zeus-platform-dun.vercel.app"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$url/api/health" || true)
            if [ "$code" = "200" ] && grep -q "${GITHUB_SHA:0:7}" /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "attempt $attempt: HTTP $code (want 200 serving ${GITHUB_SHA:0:7})"
            cat /tmp/health.json 2>/dev/null || true
            sleep 5
          done
          echo "Health check failed; rolling back."
          exit 1

      - name: Roll back on failed smoke test
        if: failure() && steps.deploy.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # Promotes the previous good deployment back to the alias rather than
        # leaving a broken one serving traffic.
        run: vercel rollback --yes --token="$VERCEL_TOKEN"
